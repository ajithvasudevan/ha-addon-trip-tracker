name: Trip Tracker
version: "1.0.1"
slug: trip-tracker
description: Live trip map — a GPS track that grows as you travel (fed by the MyMessages app over MQTT) plus immich photo markers, stored in the recorder Postgres.
url: "https://github.com/ajithvasudevan/ha-config"
arch:
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8098
panel_icon: mdi:map-marker-path
panel_title: Trip Tracker
panel_admin: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Trip Tracker web UI — direct access outside HA (http://<ha-host>:8099/)
services:
  - mqtt:want
map:
  - config:ro
options:
  db_uri: ""
  ha_url: "http://homeassistant:8123"
  ha_token: ""
  immich_url: "http://172.20.1.127:2283"
  immich_key: ""
  google_maps_key: ""
  app_token: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  base_topic: "trips"
  photo_poll_s: 20
  match_tolerance_s: 120
  near_track_radius_m: 300
  max_speed_kmph: 150
  map_center_lat: 12.9716
  map_center_lon: 77.5946
  map_zoom: 13
  log_level: info
schema:
  db_uri: "password?"
  ha_url: "url"
  ha_token: "password?"
  immich_url: "url"
  immich_key: "password?"
  google_maps_key: "password?"
  app_token: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_user: "str?"
  mqtt_password: "password?"
  base_topic: "str"
  photo_poll_s: "int(5,3600)"
  match_tolerance_s: "int(5,3600)"
  near_track_radius_m: "int(10,100000)"
  max_speed_kmph: "int(1,5000)"
  map_center_lat: "float"
  map_center_lon: "float"
  map_zoom: "int(1,20)"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
