<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Trip Tracker</title>
  <link rel="stylesheet" href="static/vendor/leaflet.css">
  <link rel="stylesheet" href="static/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="static/app.css?v=__V__">
</head>
<body>
  <div id="app">
    <aside id="panel">
      <div class="panel-head">
        <h1>🗺️ Trip Tracker <a id="popout" href="#" target="_blank" rel="noopener" title="Open in a new window">⇱</a> <a id="reload" href="#" title="Reload latest from server (bypass cache)">↻</a></h1>
        <button id="panel-toggle" title="Hide panel">◂</button>
      </div>

      <nav id="panel-tabs">
        <button class="ptab active" data-tab="main">Trips</button>
        <button class="ptab" id="tab-start-btn" data-tab="start">Start a trip</button>
        <button class="ptab" data-tab="filter">Filter</button>
      </nav>

      <div class="ptab-page" data-page="main">
        <div class="box">
          <label class="row basemap-row">🗺️ Basemap
            <select id="basemap"></select>
          </label>
          <label class="row basemap-row" style="margin-top:10px;">
            <span style="flex:1;">🎨 Colour track by speed</span>
            <input type="checkbox" id="speed-color">
          </label>
        </div>

        <div class="box grow">
          <h2>Trips</h2>
          <ul id="trip-list"></ul>
        </div>
      </div>

      <div class="ptab-page" data-page="filter" hidden>
        <div class="box">
          <h2>People</h2>
          <div id="filter-people" class="filter-list"></div>
        </div>
        <div class="box">
          <h2>Camera</h2>
          <div id="filter-camera" class="filter-list"></div>
        </div>
        <div class="filter-foot">
          <span id="filter-count">0 images</span>
          <button id="filter-clear">Clear</button>
        </div>
      </div>

      <div class="ptab-page" data-page="start" hidden>
        <div id="start-box" class="box">
          <h2>Start a trip</h2>
          <input id="trip-name" type="text" placeholder="Trip name (optional)">
          <label class="row basemap-row">🎨 Track colour
            <input id="trip-color" type="color" value="#1565c0">
          </label>
          <label class="row basemap-row">Spacing
            <select id="trip-mode">
              <option value="hybrid">Hybrid (time + distance)</option>
              <option value="time">By time</option>
              <option value="distance">By distance</option>
            </select>
          </label>
          <label class="row" id="iv-row">Send interval <span id="iv-label">5</span> s
            <input id="trip-interval" type="range" min="1" max="60" value="5">
          </label>
          <label class="row" id="dist-row">Send every <span id="dist-label">25</span> m
            <input id="trip-distance" type="range" min="1" max="100" step="1" value="25">
          </label>
          <div class="start-actions">
            <button id="btn-start" class="primary">▶ Start Trip</button>
            <button id="btn-apply" class="primary" hidden>✓ Apply spacing to live trip</button>
            <button id="btn-stop" class="danger" hidden>■ Stop Trip</button>
          </div>
        </div>
      </div>
    </aside>

    <main id="mapwrap">
      <div id="map"></div>
      <div id="gmap"></div>
      <canvas id="edit-selcanvas"></canvas>
      <div id="edit-rubber"></div>
      <button id="panel-show" title="Show panel">▸</button>
      <button id="map-grid" title="Close map — show photo grid">✕</button>
      <button id="map-stats" title="Trip stats">📊</button>
      <button id="map-replay" title="Replay trip">⏵</button>
      <button id="map-edit" title="Edit track">✏️</button>
      <div id="speed-overlay" class="hidden"></div>
      <div id="replay-bar" hidden>
        <button id="rp-play" title="Play / pause">⏵</button>
        <input id="rp-slider" type="range" min="0" max="1000" value="0">
        <span id="rp-time" class="rp-time"></span>
        <button id="rp-close" class="ov-x" title="Close replay">✕</button>
      </div>
      <div id="stats-overlay" hidden>
        <div class="ov-head">
          <div id="stats-title" class="ov-title"></div>
          <button id="stats-close" class="ov-x" title="Close">✕</button>
        </div>
        <div id="stats-body" class="ov-body"></div>
      </div>

      <!-- track-edit toolbar (admin): appears over the map in edit mode -->
      <div id="edit-tb" hidden>
        <span id="edit-hint" class="edit-hint">Click the track to select points</span>
        <div class="edit-btns">
          <button id="et-box" title="Drag a box on the map to select points inside it">▭ Box</button>
          <button id="et-all" title="Select all points in the track">✦ All</button>
          <button id="et-add">＋ Add</button>
          <button id="et-del">🗑 Delete</button>
          <button id="et-clear" title="Clear the current selection">⊘ Clear</button>
          <button id="et-join" title="Join two endpoints with a straight line (no points added)">🔗 Join</button>
          <button id="et-fill" title="Fill big gaps within the selection with intermediate points">🧩 Fill</button>
          <button id="et-ts">ts: keep</button>
          <button id="et-undo" title="Undo">↶</button>
          <button id="et-redo" title="Redo">↷</button>
          <span class="edit-arrows">
            <button id="et-left" title="Nudge west">◀</button><button id="et-up" title="Nudge north">▲</button><button id="et-down" title="Nudge south">▼</button><button id="et-right" title="Nudge east">▶</button>
          </span>
          <label class="et-snap-l" title="Click-to-select snap radius (pixels)">snap <input id="et-snap" type="number" min="5" max="100" step="1" value="25"> px</label>
          <button id="et-close">✕ Close</button>
        </div>
      </div>
      <div id="photogrid" hidden>
        <!-- current-photo position bar: 2px red, at the very top, above the top-bar -->
        <div id="pg-progress"><div id="pg-progress-fill"></div></div>
        <div class="pg-head">
          <div id="pg-trip" class="pg-trip"></div>
          <div class="pg-head-row">
            <span id="pg-count" class="pg-count"></span>
            <span id="pg-tagcounts" class="pg-tagcounts" hidden></span>
            <span class="pg-spacer"></span>
            <button id="pg-tagall-rel" class="pg-tagall" hidden title="Tag all shown photos as Relatives">👪 Tag all</button>
            <button id="pg-tagall-world" class="pg-tagall" hidden title="Tag all shown photos as World">🌍 Tag all</button>
            <label class="pg-cols">Columns <span id="pg-cols-v">4</span>
              <input id="pg-cols" type="range" min="2" max="20" value="4">
            </label>
            <label id="pg-tagmode-row" class="pg-tagmode" hidden><input type="checkbox" id="pg-tagmode"> Tag</label>
            <button id="pg-close" title="Close grid — show map">✕</button>
          </div>
        </div>
        <div id="pg-items" class="pg-items"></div>
      </div>
    </main>

    <section id="photodock" aria-hidden="true">
      <div id="pv-stage">
        <img id="pv-img" alt="">
        <img id="pv-ghost" alt="">
        <div id="pv-play" hidden>▶</div>
        <button class="pv-nav pv-prev" id="pv-prev" title="Previous (←)">‹</button>
        <button class="pv-nav pv-next" id="pv-next" title="Next (→)">›</button>
        <button id="pv-full" title="Full screen">⛶</button>
        <button id="pv-close" title="Close">✕</button>
        <div id="pv-tags" class="pv-tags" hidden>
          <button id="pv-tag-rel" data-tag="Relatives" class="pv-tag" title="Tag/untag as Relatives">👪 Relatives</button>
          <button id="pv-tag-world" data-tag="World" class="pv-tag" title="Tag/untag as World">🌍 World</button>
          <button id="pv-del" class="pv-tag pv-del" title="Delete photo (move to immich trash)">🗑 Delete</button>
        </div>
        <div id="pv-meta"></div>
      </div>
    </section>
  </div>

  <!-- trip edit dialog (admin): rename + pick the track colour -->
  <div id="edit-modal" class="modal-hidden">
    <div class="modal-card">
      <h2>Edit trip</h2>
      <label class="row">Name
        <input id="edit-name" type="text">
      </label>
      <label class="row basemap-row">🎨 Track colour
        <input id="edit-color" type="color">
      </label>
      <label class="row basemap-row">🙈 Hide from viewers
        <input id="edit-hidden" type="checkbox">
      </label>

      <div class="modal-sec">
        <h3>Gaps</h3>
        <div class="modal-btns">
          <button id="edit-fill">🧩 Fill gaps</button>
          <button id="edit-unfill">✖ Remove filled</button>
          <span id="edit-fill-status" class="hint"></span>
        </div>
      </div>

      <div class="modal-sec">
        <h3>Export</h3>
        <div class="modal-btns">
          <a id="edit-gpx" class="btn-dl" download>⬇ GPX</a>
          <a id="edit-geojson" class="btn-dl" download>⬇ GeoJSON</a>
        </div>
      </div>

      <div class="modal-sec">
        <h3>Share links <span class="hint">scoped, read-only</span></h3>
        <div class="share-row" data-scope="relatives">
          <span class="share-lbl">👪 Relatives</span>
          <input class="share-url" type="text" readonly placeholder="(no link)">
          <button class="share-make">Create</button>
          <button class="share-copy" hidden>Copy</button>
          <button class="share-del" hidden>Remove</button>
        </div>
        <div class="share-row" data-scope="world">
          <span class="share-lbl">🌍 World</span>
          <input class="share-url" type="text" readonly placeholder="(no link)">
          <button class="share-make">Create</button>
          <button class="share-copy" hidden>Copy</button>
          <button class="share-del" hidden>Remove</button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="edit-cancel">Cancel</button>
        <button id="edit-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- transient shield: swallows the stray tap/click left over when the fullscreen overlay closes under
       the finger, so the map below doesn't pan/zoom from it -->
  <div id="tap-shield"></div>

  <div id="lightbox" class="lb-hidden" aria-hidden="true">
    <button id="lb-prev" class="lb-nav" title="Previous (←)">‹</button>
    <img id="lb-img" alt="">
    <img id="lb-ghost" alt="">
    <video id="lb-video" controls playsinline preload="metadata" style="display:none"></video>
    <button id="lb-next" class="lb-nav" title="Next (→)">›</button>
    <button id="lb-close" title="Close (Esc)">✕</button>
    <a id="lb-orig" href="#" target="_blank" rel="noopener">Open original ↗</a>
    <div id="lb-meta"></div>
  </div>

  <script src="static/vendor/leaflet.js"></script>
  <script src="static/vendor/maplibre-gl.js"></script>
  <script src="static/vendor/leaflet-maplibre-gl.js"></script>
  <script src="static/app.js?v=__V__"></script>
</body>
</html>
